apis:
- aid: cerapedics-mcp
  name: Cerapedics MCP Server
  description: 'An OAuth-protected Model Context Protocol (MCP) server operated by
    Cerapedics at mcp.cerapedics.com. The endpoint publishes RFC 9728 protected-resource
    metadata and RFC 8414 authorization-server metadata anonymously, and answers every
    other request with an RFC 6750 401 challenge carrying a resource_metadata pointer.
    Authorization is delegated to Microsoft Entra ID using the authorization-code flow
    with PKCE S256. The tool surface is not publicly readable: an anonymous JSON-RPC
    tools/list call returns 401, so tool names and input schemas require authenticated
    introspection against the Cerapedics tenant. This appears to be an internal /
    tenant-restricted MCP deployment rather than a public developer API.'
